# Used by the RAG example only, mounted as application.properties by its //FILES
# directive. The other examples of this directory keep application.properties.

spring.main.web-application-type=none
spring.main.banner-mode=off
logging.level.root=WARN
logging.level.org.springframework.boot.autoconfigure.AutoConfigurationPackages=ERROR

# base-url must include the /v1 suffix: the OpenAI SDK underneath only appends
# the operation path.
spring.ai.openai.base-url=https://oai.endpoints.kepler.ai.cloud.ovh.net/v1
spring.ai.openai.api-key=${OVH_AI_ENDPOINTS_ACCESS_TOKEN}
spring.ai.openai.chat.options.model=gpt-oss-120b
spring.ai.openai.embedding.options.model=bge-m3
