# OVHcloud AI Endpoints (OpenAI-compatible) configuration, shared by both examples.

# Keep the console output clean for a CLI chatbot.
quarkus.banner.enabled=false
quarkus.log.level=WARN

# Point the OpenAI-compatible client at OVHcloud AI Endpoints and pick the model.
quarkus.langchain4j.openai.base-url=https://oai.endpoints.kepler.ai.cloud.ovh.net/v1
quarkus.langchain4j.openai.chat-model.model-name=gpt-oss-120b

# The api-key is read from the OVH_AI_ENDPOINTS_ACCESS_TOKEN environment variable
# via a Quarkus config expression. It is resolved at runtime (api-key is runtime
# config), so the value is never hard-coded and the build does not need it.
quarkus.langchain4j.openai.api-key=${OVH_AI_ENDPOINTS_ACCESS_TOKEN}

# Uncomment to log the raw requests/responses:
#quarkus.langchain4j.openai.log-requests=true
#quarkus.langchain4j.openai.log-responses=true
